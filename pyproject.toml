[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obens-sdk"
version = "0.1.2"
description = "SDK for the Obens integration API: push farmers, facilities and partners under your own ids"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/Obens-Ltd/obens-sdk-python"
Source = "https://github.com/Obens-Ltd/obens-sdk-python"
Issues = "https://github.com/Obens-Ltd/obens-sdk-python/issues"

[tool.setuptools.packages.find]
include = ["obens_sdk*"]
